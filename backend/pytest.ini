[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=app
    --cov-report=term
    --cov-fail-under=80
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    unit: Pure logic — no database, no HTTP, no app fixtures
    integration: Drives the app through its API, against a real (SQLite) database
    slow: Anything that takes more than a second
